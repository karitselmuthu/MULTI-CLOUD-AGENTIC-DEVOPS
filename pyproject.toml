[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "enterprise-multicloud-agentic-devops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.2",
  "pydantic==2.14.3",
  "sqlalchemy==2.0.57",
  "psycopg[binary]==3.3.8",
  "uvicorn==0.54.0",
  "temporalio==1.35.0",
  "langgraph==1.2.20",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.hatch.build.targets.wheel]
packages = ["apps", "orchestration", "agents", "gateways", "security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
